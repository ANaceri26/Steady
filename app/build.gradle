plugins { id 'com.android.application' }
android {
    namespace 'com.steady.scheduler'
    compileSdk 35
    defaultConfig {
        applicationId 'com.steady.scheduler.preview2'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '0.5.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { buildConfig true }
    flavorDimensions 'design'
    productFlavors {
        fixed {
            dimension 'design'
            applicationIdSuffix '.fixed'
            buildConfigField 'boolean', 'REDESIGN', 'false'
            manifestPlaceholders = [appLabel: 'Steady Fixed']
        }
        studio {
            dimension 'design'
            applicationIdSuffix '.studio'
            buildConfigField 'boolean', 'REDESIGN', 'true'
            manifestPlaceholders = [appLabel: 'Steady']
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { debug { applicationIdSuffix '.dev'; versionNameSuffix '-preview' } }
    testOptions { unitTests.includeAndroidResources = true }
}
dependencies {
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}

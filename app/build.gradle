plugins { id 'com.android.application' }
def steadyConfig = new Properties()
def steadyLocal = rootProject.file('local.properties')
if (steadyLocal.exists()) steadyLocal.withInputStream { steadyConfig.load(it) }
def quoted = { value -> '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"' }
android {
    namespace 'com.steady.scheduler'
    compileSdk 35
    defaultConfig {
        applicationId 'com.steady.scheduler.preview2'
        minSdk 26
        targetSdk 35
        versionCode 11
        versionName '1.0.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'SUPABASE_URL', quoted(steadyConfig.getProperty('steady.supabase.url', ''))
        buildConfigField 'String', 'SUPABASE_KEY', quoted(steadyConfig.getProperty('steady.supabase.key', ''))
        buildConfigField 'String', 'WEB_URL', quoted(steadyConfig.getProperty('steady.web.url', 'https://steady.naceriabderrahmene.workers.dev/'))
    }
    buildFeatures { buildConfig true }
    flavorDimensions 'design'
    productFlavors {
        fixed {
            dimension 'design'
            applicationIdSuffix '.fixed'
            buildConfigField 'boolean', 'REDESIGN', 'false'
            manifestPlaceholders = [appLabel: 'Steady Fixed']
        }
        studio {
            dimension 'design'
            applicationIdSuffix '.studio'
            buildConfigField 'boolean', 'REDESIGN', 'true'
            manifestPlaceholders = [appLabel: 'Steady']
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { debug { applicationIdSuffix '.dev' } }
    testOptions { unitTests.includeAndroidResources = true }
}
dependencies {
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
